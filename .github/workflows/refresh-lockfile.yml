name: Refresh lockfile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install and write full lockfile
        run: |
          rm -f package-lock.json
          npm install
          python3 - <<'PY'
          import json
          d=json.load(open("package-lock.json"))
          n=len(d.get("packages", {}))
          print(f"packages={n}")
          if n < 50:
              raise SystemExit("lockfile still empty/too small")
          PY
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "lockfile unchanged"
          else
            git commit -m "Regenerate full npm package-lock.json via CI"
            git push
          fi
