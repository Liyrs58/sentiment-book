name: Assemble desk
on:
  push:
    paths:
      - .github/desk-b64/**
      - .github/workflows/assemble-desk.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit desk.tsx
        run: |
          python3 - <<'PY'
          import base64, pathlib
          parts = sorted(pathlib.Path('.github/desk-b64').glob('*.txt'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          pathlib.Path('components/desk.tsx').write_bytes(data)
          assert b'export function Desk' in data and b'PLACEHOLDER' not in data
          print('packages ok', len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/desk.tsx
          git commit -m "Restore desk.tsx with StatusBadges wiring" || echo unchanged
          git push
