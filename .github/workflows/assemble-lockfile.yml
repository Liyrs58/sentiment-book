name: Assemble package-lock
on:
  push:
    branches: [main]
    paths:
      - '.ci/lock-parts/**'
      - '.github/workflows/assemble-lockfile.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble package-lock.json from parts
        run: |
          set -euo pipefail
          if [ ! -f .ci/lock-parts/part-01.b64 ] || [ ! -f .ci/lock-parts/part-02.b64 ] || [ ! -f .ci/lock-parts/part-03.b64 ]; then
            echo "Not all parts present yet; skipping"
            exit 0
          fi
          cat .ci/lock-parts/part-01.b64 .ci/lock-parts/part-02.b64 .ci/lock-parts/part-03.b64 | tr -d '\n' | base64 -d | gzip -d > package-lock.json
          python3 - <<'PY'
          import json, os
          size = os.path.getsize('package-lock.json')
          print('assembled size', size)
          assert size > 200000, size
          data = json.load(open('package-lock.json'))
          assert data.get('name') == 'sentiment-book'
          assert data.get('lockfileVersion') == 3
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm -r --ignore-unmatch .ci/lock-parts
          git add -A .ci || true
          git commit -m "Add complete npm package-lock.json"
          git push
