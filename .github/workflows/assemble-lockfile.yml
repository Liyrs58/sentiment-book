name: assemble-lockfile
on:
  push:
    paths:
      - ".lock-parts/**"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate lockfile parts
        run: |
          set -euo pipefail
          count=$(find .lock-parts -type f | wc -l)
          echo "parts=$count"
          if [ "$count" -lt 26 ]; then
            echo "waiting for all 26 parts"
            exit 0
          fi
          cat $(find .lock-parts -type f | sort) > package-lock.json
          python3 - << 'PY'
          import json, hashlib, pathlib
          p = pathlib.Path("package-lock.json")
          data = p.read_bytes()
          json.loads(data)
          print("bytes", len(data))
          print("sha256", hashlib.sha256(data).hexdigest())
          assert len(data) == 205822
          assert b"shadcn" not in data
          PY
      - name: Commit assembled lockfile
        run: |
          set -euo pipefail
          count=$(find .lock-parts -type f | wc -l)
          if [ "$count" -lt 26 ]; then
            echo "skip commit until all parts exist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .lock-parts
          git add -A package-lock.json .lock-parts
          git commit -m "Refresh lockfile after removing unused shadcn packages"
          git push
