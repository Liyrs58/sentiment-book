name: Assemble package-lock
on:
  push:
    paths:
      - ".lock-parts/**"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Assemble lockfile from parts
        run: |
          python3 << 'PY'
          from pathlib import Path
          import base64, hashlib, sys
          parts_dir = Path('.lock-parts')
          files = sorted(p for p in parts_dir.glob('*.b64'))
          print('parts', [p.name for p in files])
          if len(files) != 8:
              print('waiting for 8 parts, have', len(files))
              sys.exit(0)
          data = b''.join(base64.b64decode(p.read_text().strip()) for p in files)
          expected_len = 360871
          expected_sha = '51b04d94e72dfeff57d15ec8628ef4b0f73d7b72b42c3ebc70cff3a9c23ee5c8'
          got = hashlib.sha256(data).hexdigest()
          print('len', len(data), 'sha256', got)
          if len(data) != expected_len or got != expected_sha:
              raise SystemExit('assembled lockfile mismatch')
          Path('package-lock.json').write_bytes(data)
          PY
      - name: Commit real lockfile and remove parts
        run: |
          if [ ! -f .lock-parts/07.b64 ]; then echo skip; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .lock-parts
          rm -f .github/workflows/assemble-lockfile.yml
          git add -A
          git commit -m "Replace stub lockfile with the real npm lockfile"
          git push
