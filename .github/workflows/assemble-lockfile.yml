name: Assemble package-lock
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download complete package-lock.json
        run: |
          set -euo pipefail
          curl -fsSL "https://dpaste.com/A42F9X2CH.txt" -o package-lock.json
          python3 - <<'PY'
          import json, hashlib, os
          data = open('package-lock.json', 'rb').read()
          print('size', len(data))
          assert len(data) > 200000, len(data)
          digest = hashlib.sha256(data).hexdigest()
          print('sha256', digest)
          assert digest == 'ab459fa02a2a1a6eb9d2b1f36700a2243ac40b09080d3cd31cb4845fb0d79ce5'
          parsed = json.loads(data)
          assert parsed.get('name') == 'sentiment-book'
          assert parsed.get('lockfileVersion') == 3
          PY
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already complete"
            exit 0
          fi
          git commit -m "Add complete npm package-lock.json"
          git push
