name: complete-lockfile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-lockfile.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh lockfile with tsx
        run: npm install --package-lock-only --ignore-scripts
      - name: Minify and verify complete lockfile
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('package-lock.json', 'utf8');
          const data = JSON.parse(raw);
          const min = JSON.stringify(data);
          fs.writeFileSync('package-lock.json', min);
          const pkgs = Object.keys(data.packages || {});
          if (data.lockfileVersion !== 3) throw new Error('lockfileVersion');
          if (!data.requires) throw new Error('requires');
          if (pkgs.length < 700) throw new Error('too few packages: ' + pkgs.length);
          if (!pkgs.includes('node_modules/tsx')) throw new Error('missing tsx');
          console.log('packages', pkgs.length, 'bytes', Buffer.byteLength(min));
          NODE
      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/complete-lockfile.yml
          git add package-lock.json .github/workflows/complete-lockfile.yml
          git status
          git commit -m "Add complete minified package-lock.json with tsx"
          git push
