name: CI

on:
  push:
    branches: [main, "quant/**"]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (offline)
        run: npm test
      - name: Build
        run: npm run build
      - name: Research pipeline smoke
        run: npm run pipeline
